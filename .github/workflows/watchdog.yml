name: Wort des Tages — Wächter

on:
  # Four hours after each posting cron: past the delay Actions is known for,
  # early enough that a missed post can still be sent by hand the same day.
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Reads data/state.json as committed by the posting run, so it does not
      # matter whether that run failed, was cancelled or never started.
      - name: Check the slot that is due
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: python -m bot.watchdog

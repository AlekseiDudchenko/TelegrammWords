name: Wort des Tages

on:
  schedule:
    # Two posts a day, in UTC — 08:00 and 18:00 Berlin time in summer, an hour
    # earlier in winter. Both sit hours away from the noon boundary that
    # separates the two slots in bot/state.py, so the delay Actions cron is
    # known for (10–15 minutes, occasionally more) cannot merge them.
    - cron: "0 6 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      word:
        description: "Specific word instead of the next one from the list"
        required: false
        type: string
      force:
        description: "Post even if this half of the day has already been served"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Only write the card to the log, send nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wort-des-tages
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # ANTHROPIC_API_KEY may be empty: words with a card in data/cards.yml are
      # posted straight from the repository and never reach the API.
      - name: Post the card of the day
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m bot.main \
            ${{ inputs.word && format('--word {0}', inputs.word) || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # State is committed after sending. If the push fails, the next run sees
      # the old date and would post twice — hence the rebase-retry loop and a
      # failing job as the signal.
      - name: Commit state
        if: success() && !inputs.dry_run
        run: |
          if git diff --quiet -- data/state.json; then
            echo "State unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "Wort des Tages: update state"
          for delay in 0 2 4 8; do
            sleep "$delay"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push failed, retrying …"
          done
          echo "::error::Could not push state — the next run may post twice."
          exit 1

      # Only failures this job lived to see are reported here. A run that
      # never got a runner is cancelled with all its steps, including this
      # one — watchdog.yml is what notices that case.
      - name: Report the failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: python -m bot.alert "The posting run failed."

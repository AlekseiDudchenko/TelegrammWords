name: Wort des Tages

on:
  schedule:
    # UTC — 08:00 in Berlin im Sommer, 07:00 im Winter.
    # GitHub-Cron ist nicht minutengenau; Verzögerungen sind normal.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      word:
        description: "Bestimmtes Wort statt des nächsten aus der Liste"
        required: false
        type: string
      force:
        description: "Auch posten, wenn heute schon gepostet wurde"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Nur die Karte ins Log schreiben, nichts senden"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wort-des-tages
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Karte erzeugen und posten
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m bot.main \
            ${{ inputs.word && format('--word {0}', inputs.word) || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # Der Zustand wird nach dem Senden festgeschrieben. Schlägt der Push fehl,
      # sieht der nächste Lauf das alte Datum und würde doppelt posten — daher
      # der Rebase-Versuch in der Schleife und ein fehlschlagender Job als Signal.
      - name: Zustand festschreiben
        if: success() && !inputs.dry_run
        run: |
          if git diff --quiet -- data/state.json; then
            echo "Zustand unverändert."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "Wort des Tages: Zustand aktualisiert"
          for delay in 0 2 4 8; do
            sleep "$delay"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push fehlgeschlagen, neuer Versuch …"
          done
          echo "::error::Zustand konnte nicht gepusht werden — nächster Lauf könnte doppelt posten."
          exit 1

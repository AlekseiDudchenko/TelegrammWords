    - "ohne Rücksicht auf Verluste"
    - "aus Rücksicht schweigen"

Vielfalt:
  wort: "Vielfalt"
  artikel: "die"
  plural: null
  stammformen: null
  wortart: "Substantiv"
  ipa: "ˈfiːlfalt"
  niveau: "B2"
  bedeutungen:
    - "Das Vorhandensein vieler verschiedener Formen, Arten oder Möglichkeiten."
  etymologie: >-
    Rückbildung des späten 18. Jahrhunderts zum viel älteren Adjektiv
    „vielfältig“ (15. Jahrhundert). Dessen zweiter Teil gehört zu „falten“:
    Etwas Vielfältiges ist wörtlich etwas vielfach Gefaltetes. Dieselbe
    Bildung steckt in „einfältig“ und „mannigfaltig“.
  beispiele:
    - "Auf dem Markt gibt es eine erstaunliche Vielfalt an altem Gemüse."
    - "Die Vielfalt der Dialekte geht langsam verloren."
    - "Vielfalt macht eine Stadt interessant."
  synonyme:

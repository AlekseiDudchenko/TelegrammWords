    - "die Vielfalt bewahren"

Geduld:
  wort: "Geduld"
  artikel: "die"
  plural: null
  stammformen: null
  wortart: "Substantiv"
  ipa: "ɡəˈdʊlt"
  niveau: "B1"
  bedeutungen:
    - "Die Fähigkeit, ruhig zu warten oder etwas Unangenehmes ohne Ärger auszuhalten."
  etymologie: >-
    Zu „dulden“, ahd. gidult. Die Wortfamilie gehört zu einer alten Wurzel mit
    der Bedeutung „tragen, ertragen“, aus der auch das lateinische tolerare
    stammt. Geduld ist damit von Haus aus keine Untätigkeit, sondern das Tragen
    einer Last über eine Zeit hinweg.
  beispiele:
    - "Für dieses Rezept braucht man vor allem Geduld."
    - "Mit den Kindern hat sie eine Geduld, die ich nur bewundern kann."
    - "Nach einer Stunde am Telefon riss ihm der Geduldsfaden."
  synonyme:
    - "Ausdauer"
    - "Langmut"
    - "Gelassenheit"
    - "Nachsicht"
  antonyme:
    - "Ungeduld"
    - "Hast"
  kollokationen:
    - "Geduld haben"
    - "jemandes Geduld auf die Probe stellen"
    - "sich in Geduld üben"

Gelegenheit:
  wort: "Gelegenheit"
  artikel: "die"
  plural: "die Gelegenheiten"
  stammformen: null
  wortart: "Substantiv"
  ipa: "ɡəˈleːɡn̩haɪ̯t"
  niveau: "B1"
  bedeutungen:
    - "Ein günstiger Zeitpunkt oder Umstand, um etwas zu tun."
    - "Ein besonderer Anlass."
  etymologie: >-
    Zu „gelegen“, dem Partizip von „liegen“: Aus „nahe gelegen, benachbart“
    wurde „bequem, passend“. Mhd. gelegenheit meinte noch die Art, wie etwas
    liegt, also die Lage der Dinge; die heutige Bedeutung entwickelte sich
    unter dem Einfluss des Adjektivs und entspricht lat. occasio, frz.
    occasion.
  beispiele:
    - "Ich hatte noch keine Gelegenheit, mit ihr darüber zu sprechen."
    - "Diese Gelegenheit kommt so schnell nicht wieder — ergreif sie."
    - "Das Kleid trägt sie nur zu besonderen Gelegenheiten."
  synonyme:
    - "Chance"
    - "Anlass"
    - "Möglichkeit"
    - "Augenblick"
  antonyme: []
  kollokationen:
    - "die Gelegenheit ergreifen"
    - "bei Gelegenheit"
    - "Gelegenheit macht Diebe"

Haus:
  wort: "Haus"
  artikel: "das"
  plural: "die Häuser"
  stammformen: null
  wortart: "Substantiv"
  ipa: "haʊ̯s"
  niveau: "A2"
  bedeutungen:
    - "Ein Gebäude, in dem Menschen wohnen."
    - "Die Familie oder Gemeinschaft, die darin lebt."
  etymologie: >-
    Ahd. hūs (8. Jh.), gemeingermanisch (engl. house, niederl. huis, got. hūs).
    Schon im Althochdeutschen meint das Wort nicht nur das Gebäude, sondern
    auch Familie, Hausgemeinschaft und Geschlecht — daher das „Haus Habsburg“.
    Die weitere Herkunft ist unsicher; möglich ist ein Anschluss an eine Wurzel
    „bedecken“, zu der auch Haut, Hütte, Scheune und Schuh gehören.
  beispiele:
    - "Das Haus am Ende der Straße steht seit Jahren leer."
    - "Wir sind gestern Abend spät nach Hause gekommen."
    - "Im ganzen Haus roch es nach frischem Brot."
  synonyme:
    - "Gebäude"
    - "Wohnhaus"
    - "Anwesen"
    - "Heim"
  antonyme: []
  kollokationen:
    - "nach Hause gehen"
    - "zu Hause sein"
    - "das Haus hüten"

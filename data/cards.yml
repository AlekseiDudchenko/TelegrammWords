# Pre-written word cards, written by hand and checked into the repository.
#
# A word that has a card here is posted from this file — no API call, no key
# needed. The bot works through these first, in the order they appear below,
# and only falls back to the Claude API once they are used up.
#
# The keys must match the words in words.yml exactly, and every card must
# satisfy the WordCard schema in bot/models.py (tests/test_cards.py checks it).
#
# The etymologies follow the Etymologisches Wörterbuch des Deutschen (Pfeifer)
# as published on dwds.de. Where DWDS has no etymology entry — Sprachgefühl,
# Fingerspitzengefühl, Weltschmerz, Fernweh — the text stays with what the
# other DWDS dictionaries (¹DWB, WDG) support and avoids dating the word.

Fernweh:
  wort: "Fernweh"
  artikel: "das"
  plural: null
  stammformen: null
  wortart: "Substantiv"
  ipa: "ˈfɛʁnveː"
  niveau: "B1"
  bedeutungen:
    - "Die Sehnsucht danach, in die Ferne zu reisen und fremde Orte zu sehen."
  etymologie: >-
    Gebildet aus „fern“ und „Weh“, wörtlich also der Schmerz über die fehlende
    Ferne — eine Analogiebildung zum viel älteren „Heimweh“, das schon im 17.
    Jahrhundert belegt ist. Geprägt hat es der Fürst Hermann von
    Pückler-Muskau, der es ab 1835 in seinen vielgelesenen Reiseberichten
    gebraucht. Wie beim Heimweh ist das Gefühl als körperliches Leiden gedacht.
  beispiele:
    - "Jedes Mal, wenn ein Flugzeug über das Haus fliegt, bekomme ich Fernweh."
    - "Sein Fernweh war am Ende stärker als die Angst vor dem Alleinsein."
    - "Im November packt mich regelmäßig das Fernweh."
  synonyme:
    - "Reiselust"
    - "Wanderlust"
    - "Reisefieber"
    - "Abenteuerlust"
  antonyme:
    - "Heimweh"
    - "Bodenständigkeit"
  kollokationen:
    - "Fernweh haben"
    - "das Fernweh packt jemanden"
    - "von Fernweh getrieben sein"

Zeitgeist:
  wort: "Zeitgeist"
  artikel: "der"
  plural: null
  stammformen: null
  wortart: "Substantiv"
  ipa: "ˈtsaɪ̯tɡaɪ̯st"
  niveau: "B2"
  bedeutungen:
    - "Die Denkweise, die Stimmung und die Werte, die für eine bestimmte Epoche typisch sind."
  etymologie: >-
    Zusammengesetzt aus „Zeit“ und „Geist“, geprägt von Herder im Jahr 1769.
    Hegel macht daraus später einen festen Begriff der Philosophie. Das
    deutsche Wort wurde unverändert ins Englische und in andere Sprachen
    übernommen.
  beispiele:
    - "Der Film trifft den Zeitgeist der frühen Neunziger erstaunlich genau."
    - "Wer nur dem Zeitgeist folgt, wirkt schon nach wenigen Jahren altmodisch."
    - "Solche Debatten sagen mehr über den Zeitgeist als über die Sache selbst."
  synonyme:
    - "Zeitströmung"
    - "Zeitstimmung"
    - "Zeitgefühl"
    - "Geist der Epoche"
  antonyme: []
  kollokationen:
    - "den Zeitgeist treffen"
    - "dem Zeitgeist hinterherlaufen"
    - "im Zeitgeist liegen"

Traum:
  wort: "Traum"
  artikel: "der"
  plural: "die Träume"
  stammformen: null
  wortart: "Substantiv"
  ipa: "tʁaʊ̯m"
  niveau: "A2"
  bedeutungen:
    - "Die Bilder und Geschichten, die man im Schlaf erlebt."
    - "Ein großer Wunsch, den man sich für sein Leben vorstellt."
  etymologie: >-
    Ahd. troum (9. Jh.), mhd. troum; das Wort ist in allen germanischen
    Sprachen verbreitet (engl. dream, niederl. droom). Zugrunde liegt wohl
    germ. *drauma- aus *draugma- „nicht wirkliches Bild, Trugbild“, zu einer
    Wurzel für „trügen“. Ganz sicher ist das nicht: Genaue lautliche
    Entsprechungen fehlen, und die Deutung als bloßes Trugbild passt schlecht
    dazu, dass Träume früher als wahr und bedeutungsvoll galten.
  beispiele:
    - "Ich hatte heute Nacht einen seltsamen Traum von unserem alten Haus."
    - "Ein eigenes Café zu eröffnen war schon immer ihr Traum."
    - "Der Abend war so schön, dass er ihr später wie ein Traum vorkam."
  synonyme:
    - "Wunschtraum"
    - "Vision"
    - "Wunschbild"
    - "Illusion"
  antonyme:
    - "Wirklichkeit"
    - "Albtraum"
  kollokationen:
    - "sich einen Traum erfüllen"
    - "ein Traum geht in Erfüllung"
    - "wie im Traum"

Sehnsucht:
  wort: "Sehnsucht"
  artikel: "die"
  plural: "die Sehnsüchte"
  stammformen: null
  wortart: "Substantiv"
  ipa: "ˈzeːnzʊxt"
  niveau: "B1"
  bedeutungen:
    - "Ein starkes, schmerzliches Verlangen nach jemandem oder etwas, das gerade fehlt."
  etymologie: >-
    Mhd. sensuht bedeutete wörtlich „Krankheit des schmerzlichen Verlangens“.
    Der zweite Teil gehört nicht zu „suchen“, sondern zu „siech“ (krank) —
    dieselbe Wurzel steckt in „Schwindsucht“ und „Eifersucht“. Das Wort trägt
    die Vorstellung eines Leidens also von Anfang an in sich.
  beispiele:
    - "Nach zwei Jahren im Ausland wuchs seine Sehnsucht nach der eigenen Sprache."
    - "Sie sah dem Zug mit einer Sehnsucht nach, die sie sich selbst nicht erklären konnte."
    - "In seinen Briefen steht mehr Sehnsucht als Nachricht."
  synonyme:
    - "Verlangen"
    - "Sehnen"
    - "Begehren"
    - "Drang"
  antonyme:
    - "Gleichgültigkeit"
    - "Zufriedenheit"
  kollokationen:
    - "Sehnsucht nach jemandem haben"
    - "voller Sehnsucht"
    - "eine Sehnsucht stillen"

Schadenfreude:
  wort: "Schadenfreude"
  artikel: "die"
  plural: null
  stammformen: null
  wortart: "Substantiv"
  ipa: "ˈʃaːdn̩ˌfʁɔɪ̯də"
  niveau: "B2"
  bedeutungen:
    - "Die heimliche Freude über das Missgeschick oder das Unglück eines anderen."
  etymologie: >-
    Aus „Schaden“ und „Freude“, seit dem 16. Jahrhundert belegt. Weil in vielen
    Sprachen ein eigenes Wort dafür fehlt, wurde das deutsche als Ganzes
    entlehnt. Das Sprichwort „Schadenfreude ist die schönste Freude“ spielt mit
    der Doppelbödigkeit des Gefühls.
  beispiele:
    - "Er konnte seine Schadenfreude kaum verbergen, als der Nachbar im Regen stand."
    - "In ihrem Lachen lag eine leise Schadenfreude."
    - "Aus reiner Schadenfreude erzählte sie die Geschichte gleich weiter."
  synonyme:
    - "Häme"
    - "Hohn"
    - "Spott"
    - "Genugtuung"
  antonyme:
    - "Mitgefühl"
    - "Mitleid"
    - "Anteilnahme"
  kollokationen:
    - "klammheimliche Schadenfreude"
    - "Schadenfreude empfinden"
    - "aus reiner Schadenfreude"

Mut:
  wort: "Mut"
  artikel: "der"
  plural: null
  stammformen: null
  wortart: "Substantiv"
  ipa: "muːt"
  niveau: "A2"
  bedeutungen:
    - "Die Fähigkeit, etwas zu tun, obwohl man Angst hat oder ein Risiko eingeht."
  etymologie: >-
    Ahd. muot (8. Jh.) bedeutete „Kraft des Denkens, Seele, Herz, Gesinnung,
    Gefühl, Absicht“. Die Tapferkeit ist eine Verengung, die sich erst seit dem
    16. Jahrhundert durchsetzt. Die alte, weitere Bedeutung steckt noch in
    Demut, Anmut, Schwermut und Übermut, wo es nirgends um Tapferkeit geht;
    auch „zumute sein“ bewahrt sie.
  beispiele:
    - "Es kostet Mut, vor so vielen Menschen zu sprechen."
    - "Sie fasste Mut und stellte die Frage trotzdem."
    - "Nach der dritten Absage verlor er langsam den Mut."
  synonyme:
    - "Tapferkeit"
    - "Courage"
    - "Beherztheit"
    - "Kühnheit"
  antonyme:
    - "Angst"
    - "Feigheit"
  kollokationen:
    - "Mut fassen"
    - "jemandem Mut machen"
    - "den Mut verlieren"

Zwiespalt:
  wort: "Zwiespalt"
  artikel: "der"
  plural: null
  stammformen: null
  wortart: "Substantiv"
  ipa: "ˈtsviːʃpalt"
  niveau: "C1"
  bedeutungen:
    - "Ein innerer Widerstreit, bei dem zwei Gefühle oder Überzeugungen gleichzeitig gegeneinander ziehen."
    - "Eine tiefe Uneinigkeit zwischen zwei Seiten."
  etymologie: >-
    Zu „zwie-“ „doppelt, zweifach“ und „spalten“; das Adjektiv „zwiespältig“
    geht auf ahd. zwispaltīg (11. Jh.) zurück. Gemeint war zunächst ganz
    konkret die Spaltung in zwei Teile, etwa die Spaltung der Kirche. Später
    wird das Bild vor allem nach innen gewendet — gespalten ist nun der Mensch
    selbst.
  beispiele:
    - "Sie geriet in einen Zwiespalt zwischen Loyalität und eigener Überzeugung."
    - "Der Zwiespalt zwischen den beiden Lagern war nicht mehr zu überbrücken."
    - "Er steckte tagelang in diesem Zwiespalt und konnte sich nicht entscheiden."
  synonyme:
    - "Zerrissenheit"
    - "Dilemma"
    - "innerer Konflikt"
    - "Ambivalenz"
  antonyme:
    - "Einigkeit"
    - "Klarheit"
    - "Entschlossenheit"
  kollokationen:
    - "in einen Zwiespalt geraten"
    - "sich in einem Zwiespalt befinden"
    - "einen inneren Zwiespalt austragen"

Vorurteil:
  wort: "Vorurteil"
  artikel: "das"
  plural: "die Vorurteile"
  stammformen: null
  wortart: "Substantiv"
  ipa: "ˈfoːɐ̯ʔʊʁtaɪ̯l"
  niveau: "B1"
  bedeutungen:
    - "Eine feste Meinung über jemanden oder etwas, die man sich ohne eigene Prüfung gebildet hat."
  etymologie: >-
    Lehnübersetzung des lateinischen praeiudicium, wörtlich „Vor-Urteil“: ein
    Urteil, das vor der eigentlichen Prüfung gefällt wird. Im 17. und 18.
    Jahrhundert wurde das Wort zu einem Kampfbegriff der Aufklärung, die dem
    Vorurteil die eigene Vernunft entgegenstellte.
  beispiele:
    - "Gegen dieses Vorurteil hilft nur, die Leute persönlich kennenzulernen."
    - "Sie ging ohne Vorurteil in das Gespräch."
    - "Viele Vorurteile halten sich hartnäckig, obwohl jeder sie widerlegen könnte."
  synonyme:
    - "Voreingenommenheit"
    - "Klischee"
    - "Ressentiment"
    - "Befangenheit"
  antonyme:
    - "Unvoreingenommenheit"
    - "Offenheit"
    - "Sachlichkeit"
  kollokationen:
    - "ein Vorurteil abbauen"
    - "Vorurteile gegenüber jemandem haben"
    - "mit Vorurteilen aufräumen"

Gemütlichkeit:
  wort: "Gemütlichkeit"
  artikel: "die"
  plural: null
  stammformen: null
  wortart: "Substantiv"
  ipa: "ɡəˈmyːtlɪçkaɪ̯t"
  niveau: "B2"
  bedeutungen:
    - "Eine warme, entspannte Behaglichkeit, in der man sich sicher und wohl fühlt."
  etymologie: >-
    Abgeleitet von „Gemüt“, ahd. gimuoti (9. Jh.), mhd. gemüete — im Kern also
    wieder das alte „Mut“ als „Gesinnung“. „Gemütlich“ hieß zunächst „dem
    Gemüt entsprechend, angenehm“, dann „das Gemüt betreffend“ (16. Jh.), und
    ist seit dem 18. Jahrhundert im heutigen Sinn „behaglich“ geläufig. Erst
    das 19. Jahrhundert machte die Gemütlichkeit zum Sinnbild bürgerlicher
    Wohnkultur.
  beispiele:
    - "Zwei Kerzen, und schon stellte sich eine gewisse Gemütlichkeit ein."
    - "Wir haben den Abend in aller Gemütlichkeit ausklingen lassen."
    - "Bei diesem Thema hört die Gemütlichkeit allerdings auf."
  synonyme:
    - "Behaglichkeit"
    - "Geborgenheit"
    - "Wohlbehagen"
    - "Beschaulichkeit"
  antonyme:
    - "Ungemütlichkeit"
    - "Hektik"
  kollokationen:
    - "in aller Gemütlichkeit"
    - "für Gemütlichkeit sorgen"
    - "da hört die Gemütlichkeit auf"

Ruhe:
  wort: "Ruhe"
  artikel: "die"
  plural: null
  stammformen: null
  wortart: "Substantiv"
  ipa: "ˈʁuːə"
  niveau: "A2"
  bedeutungen:
    - "Ein Zustand ohne Lärm und ohne Bewegung."
    - "Die innere Gelassenheit, mit der man sich nicht aus der Fassung bringen lässt."
  etymologie: >-
    Ahd. ruowa (um 800), mhd. ruowe, aus germ. *rōwō — vgl. aengl. rōw, anord.
    rō, schwed. ro. Dahinter steht eine indogermanische Wurzel mit der
    Bedeutung „ruhen“, zu der auch griech. erōḗ „das Aufhören, Ruhe, Rast“ und
    kymr. araf „ruhig, langsam“ gehören. Dieselbe Wurzel steckt in „Rast“.
  beispiele:
    - "Nach acht Uhr kehrt in diesem Haus endlich Ruhe ein."
    - "Er bewahrte die Ruhe, obwohl alle anderen durcheinanderredeten."
    - "Lass mich bitte einen Moment in Ruhe."
  synonyme:
    - "Stille"
    - "Gelassenheit"
    - "Frieden"
    - "Erholung"
  antonyme:
    - "Lärm"
    - "Unruhe"
    - "Hektik"
  kollokationen:
    - "die Ruhe bewahren"
    - "jemanden in Ruhe lassen"
    - "sich zur Ruhe setzen"

Sprachgefühl:
  wort: "Sprachgefühl"
  artikel: "das"
  plural: null
  stammformen: null
  wortart: "Substantiv"
  ipa: "ˈʃpraːxɡəˌfyːl"
  niveau: "C1"
  bedeutungen:
    - "Das sichere Gespür dafür, was in einer Sprache natürlich klingt — auch ohne die Regel nennen zu können."
  etymologie: >-
    Durchsichtige Zusammensetzung aus „Sprache“ und „Gefühl“. Der zweite Teil
    ist der entscheidende: Gemeint ist ausdrücklich kein Wissen, sondern ein
    Empfinden, das aus vielen gehörten und gelesenen Sätzen entsteht. Das Wort
    gehört zu einer Reihe von Bildungen auf -gefühl, die eine sichere
    Urteilskraft als Sinneswahrnehmung beschreiben.
  beispiele:
    - "Welcher Fall hier stehen muss, sagt mir mein Sprachgefühl, nicht die Grammatik."
    - "Viel zu lesen ist der beste Weg, das Sprachgefühl zu schulen."
    - "Ihr Sprachgefühl ist nach zehn Jahren in Wien fast das einer Muttersprachlerin."
  synonyme:
    - "Sprachgespür"
    - "Sprachempfinden"
    - "Sprachinstinkt"
  antonyme: []
  kollokationen:
    - "ein feines Sprachgefühl haben"
    - "das Sprachgefühl schulen"
    - "gegen das Sprachgefühl verstoßen"

Erfahrung:
  wort: "Erfahrung"
  artikel: "die"
  plural: "die Erfahrungen"
  stammformen: null
  wortart: "Substantiv"
  ipa: "ɛɐ̯ˈfaːʁʊŋ"
  niveau: "B1"
  bedeutungen:
    - "Das Wissen und Können, das man durch eigenes Erleben gewonnen hat."
    - "Ein einzelnes Erlebnis, aus dem man etwas gelernt hat."
  etymologie: >-
    Zu „erfahren“, ahd. irfaran (um 800), mhd. ervarn — das hieß ganz wörtlich
    „reisen, durchfahren“ und daraus „kennenlernen, erkunden“. Mhd. ervarunge
    war entsprechend die „Durchwanderung, Erforschung“. Die alte Vorstellung
    klingt noch in „Erfahrungen sammeln“ nach und im Adjektiv „erfahren“ für
    jemanden, der viel gesehen hat.
  beispiele:
    - "Für die Stelle braucht man mehrere Jahre Erfahrung im Ausland."
    - "Ich spreche aus Erfahrung: Das dauert länger, als du denkst."
    - "Es war eine bittere Erfahrung, aber sie hat mir viel beigebracht."
  synonyme:
    - "Praxis"
    - "Routine"
    - "Kenntnis"
    - "Erlebnis"
  antonyme:
    - "Unerfahrenheit"
    - "Theorie"
  kollokationen:
    - "Erfahrungen sammeln"
    - "aus Erfahrung sprechen"
    - "eine bittere Erfahrung machen"

Weltschmerz:
  wort: "Weltschmerz"
  artikel: "der"
  plural: null
  stammformen: null
  wortart: "Substantiv"
  ipa: "ˈvɛltʃmɛʁts"
  niveau: "B2"
  bedeutungen:
    - "Die trübe Traurigkeit darüber, dass die Welt hinter dem zurückbleibt, was man von ihr erhofft."
  etymologie: >-
    Geprägt von Jean Paul in den 1820er Jahren, zunächst als „Schmerz über die
    Vergänglichkeit irdischer Herrlichkeit“. Heine nahm den Ausdruck 1831 auf,
    danach wurde er zum Modewort des Jungen Deutschland. Weil er rasch zur
    leeren Formel verkam, findet man ihn schon früh in ironischem Gebrauch.
  beispiele:
    - "Mit siebzehn und einem Band Rilke unterm Arm hatte er ordentlich Weltschmerz."
    - "Aus dem Roman spricht der Weltschmerz seiner ganzen Generation."
    - "Sonntagabends überkommt mich ein leiser Weltschmerz."
  synonyme:
    - "Melancholie"
    - "Schwermut"
    - "Lebensüberdruss"
    - "Trübsinn"
  antonyme:
    - "Lebensfreude"
    - "Zuversicht"
  kollokationen:
    - "von Weltschmerz erfüllt sein"
    - "ein Anfall von Weltschmerz"

Gefühl:
  wort: "Gefühl"
  artikel: "das"
  plural: "die Gefühle"
  stammformen: null
  wortart: "Substantiv"
  ipa: "ɡəˈfyːl"
  niveau: "A2"
  bedeutungen:
    - "Eine innere Regung wie Freude, Angst oder Trauer."
    - "Ein Eindruck, den man nicht begründen kann, aber deutlich spürt."
    - "Die Fähigkeit, mit der Haut etwas wahrzunehmen."
  etymologie: >-
    Zu „fühlen“, ahd. fuolen „befühlen, betasten“ (um 800); auf seelisches
    Erleben ausgeweitet wurde das Verb schon im Mittelhochdeutschen. Das
    Substantiv „Gefühl“ entstand im 17. Jahrhundert nach dem Muster von
    „Gehör“, „Geschmack“ und „Gesicht“, also als Name eines Sinnes. Der
    Tastsinn ist in „kein Gefühl mehr in den Fingern haben“ erhalten geblieben.
  beispiele:
    - "Ich hatte gleich ein gutes Gefühl bei der Sache."
    - "Vor Kälte hatte sie kein Gefühl mehr in den Zehen."
    - "Er zeigt seine Gefühle selten, aber sie sind da."
  synonyme:
    - "Empfindung"
    - "Emotion"
    - "Regung"
    - "Ahnung"
  antonyme:
    - "Verstand"
    - "Gleichgültigkeit"
  kollokationen:
    - "ein gutes Gefühl haben"
    - "seinen Gefühlen freien Lauf lassen"
    - "kein Gefühl für Zeit haben"

Kehrseite:
  wort: "Kehrseite"
  artikel: "die"
  plural: "die Kehrseiten"
  stammformen: null
  wortart: "Substantiv"
  ipa: "ˈkeːɐ̯ˌzaɪ̯tə"
  niveau: "C1"
  bedeutungen:
    - "Die Rückseite von etwas."
    - "Der ungünstige Teil einer an sich guten Sache."
  etymologie: >-
    Zu „kehren“ im Sinne von „wenden“: die Kehrseite ist die abgewandte Seite,
    das, was man sieht, wenn man etwas umdreht. Übertragen meint das Wort das
    Unangenehme, das einer zunächst günstig erscheinenden Sache anhaftet. Für
    die Rückseite von Münzen und Medaillen steht daneben „Revers“, Anfang des
    17. Jahrhunderts aus dem Französischen entlehnt.
  beispiele:
    - "Die Kehrseite der Freiheit ist, dass niemand dir sagt, was richtig ist."
    - "Jeder Erfolg hat eine Kehrseite, über die selten gesprochen wird."
    - "Auf der Kehrseite der Karte stand eine Adresse."
  synonyme:
    - "Rückseite"
    - "Schattenseite"
    - "Nachteil"
    - "Revers"
  antonyme:
    - "Vorderseite"
    - "Vorzug"
  kollokationen:
    - "die Kehrseite der Medaille"
    - "die Kehrseite von etwas sein"

Zufall:
  wort: "Zufall"
  artikel: "der"
  plural: "die Zufälle"
  stammformen: null
  wortart: "Substantiv"
  ipa: "ˈtsuːfal"
  niveau: "B1"
  bedeutungen:
    - "Ein Ereignis, das ohne erkennbare Absicht oder Ursache eintritt."
  etymologie: >-
    Mhd. zuoval „Anfall, was jemandem zufällt“, ein Verbalabstraktum zu
    „zufallen“. Früh diente es als Entsprechung des lateinischen accidens, also
    für das Nebensächliche, das einer Sache nur zustößt; bei den Mystikern
    Seuse und Tauler ist es ein philosophischer Begriff. Die heutige Bedeutung
    „unerwartetes Ereignis“ setzt sich seit dem 17. Jahrhundert durch.
  beispiele:
    - "Wir haben uns durch reinen Zufall am Bahnhof getroffen."
    - "Dass beide denselben Namen tragen, ist kein Zufall."
    - "Bei der Prüfung wollte sie nichts dem Zufall überlassen."
  synonyme:
    - "Fügung"
    - "Glücksfall"
    - "Koinzidenz"
    - "Zusammentreffen"
  antonyme:
    - "Absicht"
    - "Notwendigkeit"
    - "Plan"
  kollokationen:
    - "durch Zufall"
    - "der Zufall wollte es, dass …"
    - "nichts dem Zufall überlassen"

Wehmut:
  wort: "Wehmut"
  artikel: "die"
  plural: null
  stammformen: null
  wortart: "Substantiv"
  ipa: "ˈveːmuːt"
  niveau: "B2"
  bedeutungen:
    - "Eine leise Traurigkeit, die mit Zuneigung auf etwas Vergangenes zurückblickt."
  etymologie: >-
    Nur scheinbar aus „weh“ und „Mut“ zusammengesetzt: Das Wort ist eine
    Rückbildung zum älteren Adjektiv „wehmütig“ und geht auf mnd. wēmōt „Zorn,
    Schmerz, tiefe Traurigkeit“ zurück. Belegt ist es seit dem 15.
    Jahrhundert, zuerst schlesisch, später bei Luther; die weiche,
    melancholische Färbung bekam es im 18. Jahrhundert. Dass es heute feminin
    ist, verdankt es wohl dem Einfluss von „Demut“.
  beispiele:
    - "Mit einer gewissen Wehmut schloss er die Tür der alten Wohnung ab."
    - "Sie denkt ohne Wehmut an diese Jahre zurück."
    - "In seiner Stimme lag Wehmut, aber kein Vorwurf."
  synonyme:
    - "Melancholie"
    - "Schwermut"
    - "Trauer"
    - "Rührung"
  antonyme:
    - "Ausgelassenheit"
    - "Heiterkeit"
  kollokationen:
    - "mit Wehmut zurückblicken"
    - "von Wehmut ergriffen sein"

Nachbar:
  wort: "Nachbar"
  artikel: "der"
  plural: "die Nachbarn"
  stammformen: null
  wortart: "Substantiv"
  ipa: "ˈnaxbaːɐ̯"
  niveau: "A2"
  bedeutungen:
    - "Jemand, der nebenan oder ganz in der Nähe wohnt."
  etymologie: >-
    Ahd. nāhgibūr (8. Jh.), zusammengesetzt aus nāh „nahe“ und gibūro
    „Bewohner, Bauer“ — also der Nahewohnende. Genau derselbe Bau steckt im
    englischen neighbour. Der zweite Teil gehört zu „bauen“ in der alten
    Bedeutung „wohnen“; im Neuhochdeutschen ist er zum unscheinbaren -bar
    abgeschwächt.
  beispiele:
    - "Unser neuer Nachbar hat sich gestern kurz vorgestellt."
    - "Die Nachbarn gießen die Blumen, wenn wir im Urlaub sind."
    - "Der Nachbar von gegenüber grüßt grundsätzlich nicht."
  synonyme:
    - "Anwohner"
    - "Anrainer"
    - "Hausgenosse"
  antonyme: []
  kollokationen:
    - "gute Nachbarn sein"
    - "der Nachbar von gegenüber"
    - "sich mit den Nachbarn verstehen"

Fingerspitzengefühl:
  wort: "Fingerspitzengefühl"
  artikel: "das"
  plural: null
  stammformen: null
  wortart: "Substantiv"
  ipa: "ˈfɪŋɐˌʃpɪtsn̩ɡəˌfyːl"
  niveau: "C1"
  bedeutungen:
    - "Ein feines Gespür dafür, wie man in einer heiklen Lage vorgehen muss, ohne jemanden zu verletzen."
  etymologie: >-
    Wörtlich das Gefühl in den Fingerspitzen, wo der Tastsinn am feinsten ist.
    Gebraucht wird das Wort fast nur übertragen, für den sicheren Umgang mit
    Menschen und heiklen Themen. Es gehört zu derselben Reihe wie „Feingefühl“
    und „Zartgefühl“: Wörter, die geistige Feinheit als Tastsinn beschreiben.
  beispiele:
    - "Diese Verhandlung verlangt Fingerspitzengefühl, keine Lautstärke."
    - "Sie hat das Thema mit viel Fingerspitzengefühl angesprochen."
    - "Ihm fehlt jedes Fingerspitzengefühl für den richtigen Moment."
  synonyme:
    - "Feingefühl"
    - "Takt"
    - "Einfühlungsvermögen"
    - "Sensibilität"
  antonyme:
    - "Taktlosigkeit"
    - "Grobheit"
  kollokationen:
    - "Fingerspitzengefühl beweisen"
    - "etwas mit Fingerspitzengefühl behandeln"

Vertrauen:
  wort: "Vertrauen"
  artikel: "das"
  plural: null
  stammformen: null
  wortart: "Substantiv"
  ipa: "fɛɐ̯ˈtʁaʊ̯ən"
  niveau: "B1"
  bedeutungen:
    - "Die feste Überzeugung, dass man sich auf jemanden oder etwas verlassen kann."
  etymologie: >-
    Substantiviertes „vertrauen“, zu ahd. trūēn. Die Wortfamilie um „treu“,
    „trauen“ und „Trost“ gehört zu einer Wurzel mit der Bedeutung „fest, hart“,
    aus der auch „Baum“ (engl. tree) stammt. Vertrauen war ursprünglich also
    das Bild von etwas, das fest steht.
  beispiele:
    - "Vertrauen aufzubauen dauert Jahre und lässt sich in einem Satz zerstören."
    - "Sie hat volles Vertrauen in ihre Kollegin."
    - "Das sage ich dir im Vertrauen."
  synonyme:
    - "Zutrauen"
    - "Zuversicht"
    - "Verlass"
    - "Glaube"
  antonyme:
    - "Misstrauen"
    - "Argwohn"
    - "Zweifel"
  kollokationen:
    - "Vertrauen fassen"
    - "jemandes Vertrauen missbrauchen"
    - "im Vertrauen gesagt"

Zuversicht:
  wort: "Zuversicht"
  artikel: "die"
  plural: null
  stammformen: null
  wortart: "Substantiv"
  ipa: "ˈtsuːfɛɐ̯ˌzɪçt"
  niveau: "B2"
  bedeutungen:
    - "Das ruhige Vertrauen darauf, dass etwas gut ausgehen wird."
  etymologie: >-
    Ahd. zuofirsiht „ehrfurchtsvolles Aufschauen, Hoffen“ (um 1000), mhd.
    zuoversiht. Das Bild ist der Blick, der sich auf das richtet, worauf man
    sich verlässt. Gleich gebaut sind „Vorsicht“, „Nachsicht“ und „Rücksicht“,
    die alle ein Sehen in eine bestimmte Richtung meinen.
  beispiele:
    - "Trotz der schlechten Zahlen blickt sie mit Zuversicht ins nächste Jahr."
    - "Seine Zuversicht steckte alle anderen an."
    - "Nach der dritten Absage verlor er die Zuversicht."
  synonyme:
    - "Optimismus"
    - "Hoffnung"
    - "Vertrauen"
    - "Hoffnungsfreude"
  antonyme:
    - "Verzweiflung"
    - "Pessimismus"
    - "Mutlosigkeit"
  kollokationen:
    - "voller Zuversicht sein"
    - "die Zuversicht verlieren"
    - "mit Zuversicht in die Zukunft blicken"

Erinnerung:
  wort: "Erinnerung"
  artikel: "die"
  plural: "die Erinnerungen"
  stammformen: null
  wortart: "Substantiv"
  ipa: "ɛɐ̯ˈʔɪnəʁʊŋ"
  niveau: "A2"
  bedeutungen:
    - "Das Bild eines Erlebnisses, das im Gedächtnis geblieben ist."
    - "Ein Hinweis, der jemanden an etwas Vergessenes denken lässt."
  etymologie: >-
    Zu „erinnern“, das im 14. Jahrhundert aufkommt und über mhd. innern auf
    ahd. innaro „innerer, tiefer“ zurückgeht — wörtlich geht es also darum,
    etwas ins Innere zu holen. Das Substantiv „Erinnerung“ ist seit dem 15.
    Jahrhundert belegt, zunächst als „im Gedächtnis behaltener Eindruck,
    Andenken“.
  beispiele:
    - "An den Umzug habe ich nur noch eine vage Erinnerung."
    - "Der Geruch von nassem Laub weckt bei mir sofort Erinnerungen."
    - "Zur Erinnerung an den Abend haben wir ein Foto gemacht."
  synonyme:
    - "Andenken"
    - "Gedächtnis"
    - "Rückblick"
    - "Reminiszenz"
  antonyme:
    - "Vergessen"
    - "Vergessenheit"
  kollokationen:
    - "eine Erinnerung wachrufen"
    - "zur Erinnerung an etwas"
    - "in guter Erinnerung bleiben"

Verantwortung:
  wort: "Verantwortung"
  artikel: "die"
  plural: "die Verantwortungen"
  stammformen: null
  wortart: "Substantiv"
  ipa: "fɛɐ̯ˈʔantvɔʁtʊŋ"
  niveau: "B1"
  bedeutungen:
    - "Die Pflicht, für das eigene Handeln und dessen Folgen einzustehen."
    - "Die Aufgabe, für jemanden oder etwas zu sorgen."
  etymologie: >-
    Zu „verantworten“, einem Wort der Rechtssprache: Mhd. verantwürten heißt
    „sich vor Gericht rechtfertigen, verteidigen“. Im Kern steckt „Antwort“,
    gebildet mit der Vorsilbe ant- „entgegen“, ursprünglich also „Gegenrede“.
    Dass „verantwortlich“ zuerst „was sich verteidigen lässt“ meinte, hört man
    noch in „unverantwortlich“.
  beispiele:
    - "Für diesen Fehler übernehme ich die Verantwortung."
    - "Mit dem Hund kam eine Verantwortung ins Haus, die er unterschätzt hatte."
    - "Am Ende trägt die Verantwortung immer die Leitung."
  synonyme:
    - "Pflicht"
    - "Haftung"
    - "Zuständigkeit"
    - "Obhut"
  antonyme:
    - "Verantwortungslosigkeit"
    - "Gleichgültigkeit"
  kollokationen:
    - "Verantwortung übernehmen"
    - "jemanden zur Verantwortung ziehen"
    - "die Verantwortung tragen"

Übermut:
  wort: "Übermut"
  artikel: "der"
  plural: null
  stammformen: null
  wortart: "Substantiv"
  ipa: "ˈyːbɐmuːt"
  niveau: "B2"
  bedeutungen:
    - "Eine ausgelassene Stimmung, in der man leichtsinnig wird."
    - "Eine Überheblichkeit, die die eigenen Grenzen nicht mehr sieht."
  etymologie: >-
    Ahd. ubarmuot (um 1000), mhd. übermuot „stolzer, hochfahrender Sinn“: ein
    Sinn, der „über“ das rechte Maß hinausgeht. Heute klingt das Wort milder
    und meint eher fröhlichen Leichtsinn. Das Sprichwort „Übermut tut selten
    gut“ bewahrt den alten warnenden Ton.
  beispiele:
    - "Im Übermut sprangen sie noch im Oktober in den See."
    - "Sein Übermut hat ihn diesmal teuer zu stehen kommen lassen."
    - "Aus lauter Übermut haben die Kinder das halbe Zimmer umgeräumt."
  synonyme:
    - "Ausgelassenheit"
    - "Leichtsinn"
    - "Hochmut"
    - "Vermessenheit"
  antonyme:
    - "Vorsicht"
    - "Bescheidenheit"
    - "Zurückhaltung"
  kollokationen:
    - "aus lauter Übermut"
    - "Übermut tut selten gut"
    - "im Übermut handeln"

neugierig:
  wort: "neugierig"
  artikel: null
  plural: null
  stammformen: null
  wortart: "Adjektiv"
  ipa: "ˈnɔɪ̯ɡiːʁɪç"
  niveau: "A2"
  bedeutungen:
    - "So, dass man unbedingt wissen möchte, was es Neues gibt."
    - "So, dass man sich zu sehr für die Angelegenheiten anderer interessiert."
  etymologie: >-
    Aus „neu“ und „gierig“, belegt seit der Mitte des 16. Jahrhunderts. Erst
    aus dem Adjektiv wurden im 17. Jahrhundert die Substantive „Neugier“ und
    „Neugierde“ gebildet — die Gier, Neuigkeiten oder die Angelegenheiten
    anderer zu erfahren. Der leicht anrüchige Beiklang gehört also von Anfang
    an dazu und schwingt bis heute mit.
  beispiele:
    - "Ich bin neugierig, wie das Buch ausgeht."
    - "Sei nicht so neugierig, das geht dich nichts an."
    - "Ihre Fragen haben mich erst richtig neugierig gemacht."
  synonyme:
    - "wissbegierig"
    - "interessiert"
    - "gespannt"
    - "schaulustig"
  antonyme:

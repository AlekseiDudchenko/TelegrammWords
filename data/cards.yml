    - "desinteressiert"
    - "teilnahmslos"
  kollokationen:
    - "neugierig auf etwas sein"
    - "jemanden neugierig machen"

Rücksicht:
  wort: "Rücksicht"
  artikel: "die"
  plural: null
  stammformen: null
  wortart: "Substantiv"
  ipa: "ˈʁʏkˌzɪçt"
  niveau: "B1"
  bedeutungen:
    - "Das Verhalten, bei dem man die Bedürfnisse und Gefühle anderer beachtet."
  etymologie: >-
    Wörtlich „das Zurückblicken“ — im 18. Jahrhundert als Lehnübersetzung des
    lateinischen respectus gebildet, aus re- „zurück“ und specere „sehen“.
    Dasselbe Bild steckt im englischen respect. Wer Rücksicht nimmt, sieht im
    Weitergehen also noch einmal nach den anderen zurück.
  beispiele:
    - "Nimm bitte Rücksicht auf die Nachbarn, es ist nach zehn."
    - "Aus Rücksicht auf ihre Mutter hat sie nichts gesagt."
    - "Er setzt seine Pläne ohne Rücksicht auf Verluste durch."
  synonyme:
    - "Nachsicht"
    - "Takt"
    - "Verständnis"
    - "Schonung"
  antonyme:

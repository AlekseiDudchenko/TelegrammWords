# Daily collocations, published in file order. Keep English only in beispiele_en.

eine Entscheidung treffen:
  ausdruck: eine Entscheidung treffen
  niveau: B1
  bedeutung: Zwischen mehreren Möglichkeiten wählen.
  beispiele:
  - Wir müssen heute eine Entscheidung treffen.
  - Sie traf die Entscheidung, den Job zu wechseln.
  beispiele_en:
  - We have to make a decision today.
  - She made the decision to change jobs.
  gebrauch: Eine Entscheidung treffen oder fällen; über etwas entscheiden.
eine Pause machen:
  ausdruck: eine Pause machen
  niveau: A2
  bedeutung: Für kurze Zeit mit einer Arbeit oder Tätigkeit aufhören.
  beispiele:
  - Nach zwei Stunden Arbeit machen wir eine Pause.
  - Lass uns eine kurze Pause machen.
  beispiele_en:
  - After two hours of work, we take a break.
  - Let's take a short break.
  gebrauch: 'Oft mit kurz, länger oder von etwas: eine Pause vom Lernen machen.'
eine Herausforderung meistern:
  ausdruck: eine Herausforderung meistern
  niveau: B2
  bedeutung: Eine schwierige Aufgabe erfolgreich bewältigen.
  beispiele:
  - Gemeinsam können wir diese Herausforderung meistern.
  - Sie hat die neue Aufgabe trotz Zeitdruck gemeistert.
  beispiele_en:
  - Together we can overcome this challenge.
  - She mastered the new task despite the time pressure.
  gebrauch: Meistern betont den erfolgreichen Umgang mit etwas Schwierigem.
Verantwortung übernehmen:
  ausdruck: Verantwortung übernehmen
  niveau: B1
  bedeutung: Für eine Aufgabe oder die Folgen einer Handlung einstehen.
  beispiele:
  - Wer übernimmt die Verantwortung für das Projekt?
  - Er übernahm die Verantwortung für seinen Fehler.
  beispiele_en:
  - Who will take responsibility for the project?
  - He took responsibility for his mistake.
  gebrauch: Verantwortung für + Akkusativ übernehmen.
Zeit haben:
  ausdruck: Zeit haben
  niveau: A2
  bedeutung: Für etwas freie Zeit zur Verfügung haben.
  beispiele:
  - Hast du morgen Zeit für einen Spaziergang?
  - Ich habe heute leider keine Zeit.
  beispiele_en:
  - Do you have time for a walk tomorrow?
  - Unfortunately, I don't have time today.
  gebrauch: 'Mit für + Akkusativ oder zu + Infinitiv: Zeit für dich haben, Zeit haben zu lesen.'
Bedenken äußern:
  ausdruck: Bedenken äußern
  niveau: B2
  bedeutung: Sagen, warum man bei einer Sache Zweifel oder Sorgen hat.
  beispiele:
  - Mehrere Eltern äußerten Bedenken gegen den Plan.
  - Sie äußerte Bedenken hinsichtlich der Kosten.
  beispiele_en:
  - Several parents voiced concerns about the plan.
  - She expressed concerns about the costs.
  gebrauch: Bedenken gegen + Akkusativ oder hinsichtlich + Genitiv äußern.
auf jemanden Rücksicht nehmen:
  ausdruck: auf jemanden Rücksicht nehmen
  niveau: B1
  bedeutung: Die Bedürfnisse oder Gefühle einer Person beachten.
  beispiele:
  - Bitte nimm auf die anderen Fahrgäste Rücksicht.
  - Sie nimmt immer Rücksicht auf ihre Nachbarn.
  beispiele_en:
  - Please be considerate of the other passengers.
  - She is always considerate of her neighbours.
  gebrauch: Auf + Akkusativ Rücksicht nehmen; Rücksicht ist Singular.
sich Zeit nehmen:
  ausdruck: sich Zeit nehmen
  niveau: A2
  bedeutung: Etwas bewusst ohne Eile tun oder sich dafür Zeit freihalten.
  beispiele:
  - Nimm dir Zeit für die Aufgabe.
  - Am Wochenende nehme ich mir Zeit für meine Familie.
  beispiele_en:
  - Take your time with the task.
  - At the weekend, I make time for my family.
  gebrauch: 'Reflexiv: sich Zeit für jemanden oder etwas nehmen.'
Bedenken ausräumen:
  ausdruck: Bedenken ausräumen
  niveau: B2
  bedeutung: Zweifel durch Erklärungen oder Belege beseitigen.
  beispiele:
  - Der Bericht konnte unsere Bedenken nicht ausräumen.
  - Ein Gespräch räumte die letzten Bedenken aus.
  beispiele_en:
  - The report could not allay our concerns.
  - A conversation dispelled the remaining concerns.
  gebrauch: 'Das trennbare Verb heißt ausräumen: Er räumt Bedenken aus.'
in Frage kommen:
  ausdruck: in Frage kommen
  niveau: B1
  bedeutung: Als Möglichkeit geeignet oder denkbar sein.
  beispiele:
  - Für mich kommt nur ein früher Termin in Frage.
  - Diese Wohnung kommt wegen des Preises nicht in Frage.
  beispiele_en:
  - Only an early appointment works for me.
  - This flat is out of the question because of the price.
  gebrauch: Auch infrage kommen ist korrekt; etwas kommt für jemanden in Frage.
einen Termin vereinbaren:
  ausdruck: einen Termin vereinbaren
  niveau: A2
  bedeutung: Mit jemandem einen Zeitpunkt für ein Treffen festlegen.
  beispiele:
  - Ich möchte einen Termin beim Arzt vereinbaren.
  - Wir haben für Dienstag einen Termin vereinbart.
  beispiele_en:
  - I would like to make a doctor's appointment.
  - We arranged an appointment for Tuesday.
  gebrauch: Einen Termin mit jemandem oder bei einer Praxis vereinbaren.
unter Vorbehalt zustimmen:
  ausdruck: unter Vorbehalt zustimmen
  niveau: C1
  bedeutung: Zustimmen, aber eine Bedingung oder einen Einwand offenlassen.
  beispiele:
  - Dem Entwurf kann ich nur unter Vorbehalt zustimmen.
  - Die Mitglieder stimmten dem Vorschlag unter Vorbehalt zu.
  beispiele_en:
  - I can only approve the draft with reservations.
  - The members approved the proposal subject to reservations.
  gebrauch: Unter Vorbehalt zeigt, dass die Zustimmung nicht uneingeschränkt gilt.
etwas in Kauf nehmen:
  ausdruck: etwas in Kauf nehmen
  niveau: B2
  bedeutung: Eine unangenehme Folge bewusst akzeptieren.
  beispiele:
  - Für den neuen Job nehme ich einen längeren Arbeitsweg in Kauf.
  - Sie nahm die zusätzlichen Kosten in Kauf.
  beispiele_en:
  - I'm willing to accept a longer commute for the new job.
  - She accepted the extra costs.
  gebrauch: In Kauf nehmen bezieht sich oft auf Nachteile oder Risiken.
eine Rolle spielen:
  ausdruck: eine Rolle spielen
  niveau: B1
  bedeutung: Für ein Ergebnis oder eine Entscheidung wichtig sein.
  beispiele:
  - Der Preis spielt bei der Auswahl eine große Rolle.
  - Das Alter spielt hier keine Rolle.
  beispiele_en:
  - Price plays a major role in the choice.
  - Age doesn't matter here.
  gebrauch: Eine wichtige, große oder keine Rolle spielen.
einen Termin absagen:
  ausdruck: einen Termin absagen
  niveau: A2
  bedeutung: Mitteilen, dass ein geplantes Treffen nicht stattfinden kann.
  beispiele:
  - Ich muss meinen Termin für morgen absagen.
  - Bitte sagen Sie den Termin rechtzeitig ab.
  beispiele_en:
  - I have to cancel my appointment for tomorrow.
  - Please cancel the appointment in good time.
  gebrauch: 'Das trennbare Verb heißt absagen: Ich sage den Termin ab.'
auf Widerstand stoßen:
  ausdruck: auf Widerstand stoßen
  niveau: B2
  bedeutung: Bei anderen Ablehnung gegen einen Vorschlag erfahren.
  beispiele:
  - Der Plan stieß im Team auf Widerstand.
  - Die Reform könnte auf starken Widerstand stoßen.
  beispiele_en:
  - The plan met with resistance from the team.
  - The reform could face strong opposition.
  gebrauch: 'Auf + Akkusativ stoßen: auf Widerstand, Kritik oder Ablehnung.'
zur Verfügung stehen:
  ausdruck: zur Verfügung stehen
  niveau: B1
  bedeutung: Für eine Person oder einen Zweck verfügbar sein.
  beispiele:
  - Der Raum steht uns ab Montag zur Verfügung.
  - Für Fragen stehe ich gern zur Verfügung.
  beispiele_en:
  - The room will be available to us from Monday.
  - I'm happy to answer any questions.
  gebrauch: Jemandem zur Verfügung stehen; zur Verfügung stellen heißt bereitstellen.
den Bus verpassen:
  ausdruck: den Bus verpassen
  niveau: A2
  bedeutung: Zu spät kommen, um mit dem Bus zu fahren.
  beispiele:
  - Wenn wir nicht losgehen, verpassen wir den Bus.
  - Heute Morgen habe ich den Bus verpasst.
  beispiele_en:
  - If we don't leave now, we'll miss the bus.
  - I missed the bus this morning.
  gebrauch: 'Ebenso: den Zug oder den Anschluss verpassen.'
unter Druck stehen:
  ausdruck: unter Druck stehen
  niveau: B2
  bedeutung: Wegen Erwartungen oder einer Frist stark belastet sein.
  beispiele:
  - Vor der Abgabe stehen wir unter Druck.
  - Sie stand bei der Entscheidung unter großem Druck.
  beispiele_en:
  - We're under pressure before the deadline.
  - She was under great pressure when making the decision.
  gebrauch: Unter Zeitdruck stehen bezeichnet eine besonders knappe Frist.
einen Fehler machen:
  ausdruck: einen Fehler machen
  niveau: B1
  bedeutung: Etwas falsch tun oder entscheiden.
  beispiele:
  - Jeder kann einmal einen Fehler machen.
  - Bei der Rechnung habe ich einen Fehler gemacht.
  beispiele_en:
  - Anyone can make a mistake sometimes.
  - I made a mistake in the calculation.
  gebrauch: Einen Fehler machen, erkennen und korrigieren.
einkaufen gehen:
  ausdruck: einkaufen gehen
  niveau: A2
  bedeutung: In ein Geschäft gehen, um Dinge zu kaufen.
  beispiele:
  - Wir gehen nach der Arbeit einkaufen.
  - Am Samstag gehe ich mit meiner Tochter einkaufen.
  beispiele_en:
  - We're going shopping after work.
  - On Saturday, I'm going shopping with my daughter.
  gebrauch: Gehen bleibt konjugiert, einkaufen steht am Satzende.
eine Frist einhalten:
  ausdruck: eine Frist einhalten
  niveau: B2
  bedeutung: Eine Aufgabe bis zum festgelegten Zeitpunkt erledigen.
  beispiele:
  - Wir müssen die Frist für den Antrag einhalten.
  - Die Firma konnte die vereinbarte Frist nicht einhalten.
  beispiele_en:
  - We must meet the application deadline.
  - The company couldn't meet the agreed deadline.
  gebrauch: Eine Frist einhalten oder versäumen; eine Frist ist verbindlicher als ein Wunschdatum.
einen Fehler beheben:
  ausdruck: einen Fehler beheben
  niveau: B1
  bedeutung: Die Ursache eines Fehlers beseitigen.
  beispiele:
  - Das Team konnte den Fehler schnell beheben.
  - Nach dem Update ist der Fehler noch nicht behoben.
  beispiele_en:
  - The team was able to fix the error quickly.
  - The error still hasn't been fixed after the update.
  gebrauch: Typisch für technische Probleme; bei einem Tippfehler sagt man oft korrigieren.
die Tragweite erkennen:
  ausdruck: die Tragweite erkennen
  niveau: C1
  bedeutung: Die Bedeutung und möglichen Folgen einer Sache verstehen.
  beispiele:
  - Erst später erkannte sie die Tragweite ihrer Entscheidung.
  - Wir müssen die Tragweite dieser Änderung erkennen.
  beispiele_en:
  - Only later did she realise the implications of her decision.
  - We need to understand the full implications of this change.
  gebrauch: Tragweite steht oft mit erkennen, einschätzen oder unterschätzen.
den Tisch decken:
  ausdruck: den Tisch decken
  niveau: A2
  bedeutung: Teller, Besteck und Gläser für eine Mahlzeit bereitstellen.
  beispiele:
  - Kannst du bitte den Tisch decken?
  - Die Kinder haben den Tisch fürs Abendessen gedeckt.
  beispiele_en:
  - Could you set the table, please?
  - The children set the table for dinner.
  gebrauch: Den Tisch decken, aber nach dem Essen den Tisch abräumen.
eine Frist verlängern:
  ausdruck: eine Frist verlängern
  niveau: B2
  bedeutung: Einen festgelegten Abgabetermin auf einen späteren Zeitpunkt verschieben.
  beispiele:
  - Die Behörde hat die Frist um zwei Wochen verlängert.
  - Könnten Sie die Frist für uns verlängern?
  beispiele_en:
  - The authority extended the deadline by two weeks.
  - Could you extend the deadline for us?
  gebrauch: 'Eine Frist um + Akkusativ verlängern: um zwei Tage, um eine Woche.'
eine Lösung finden:
  ausdruck: eine Lösung finden
  niveau: B1
  bedeutung: Einen Weg entdecken, ein Problem zu beseitigen.
  beispiele:
  - Gemeinsam finden wir sicher eine Lösung.
  - Sie fanden eine einfache Lösung für das Problem.
  beispiele_en:
  - Together we'll surely find a solution.
  - They found a simple solution to the problem.
  gebrauch: Eine Lösung für + Akkusativ finden.
das Zimmer aufräumen:
  ausdruck: das Zimmer aufräumen
  niveau: A2
  bedeutung: Dinge im Zimmer an ihren Platz legen und Ordnung schaffen.
  beispiele:
  - Ich muss heute mein Zimmer aufräumen.
  - Räum bitte dein Zimmer vor dem Besuch auf.
  beispiele_en:
  - I need to tidy my room today.
  - Please tidy your room before the guests arrive.
  gebrauch: 'Aufräumen ist trennbar: Ich räume das Zimmer auf.'
etwas zur Sprache bringen:
  ausdruck: etwas zur Sprache bringen
  niveau: B2
  bedeutung: Ein Thema in einem Gespräch ausdrücklich ansprechen.
  beispiele:
  - Ich möchte das Problem im nächsten Meeting zur Sprache bringen.
  - Sie brachte die hohen Kosten zur Sprache.
  beispiele_en:
  - I'd like to bring up the problem in the next meeting.
  - She raised the issue of the high costs.
  gebrauch: Zur Sprache bringen ist formeller als ansprechen.
ein Ziel erreichen:
  ausdruck: ein Ziel erreichen
  niveau: B1
  bedeutung: Etwas schaffen, das man sich vorgenommen hat.
  beispiele:
  - Mit regelmäßigem Training kannst du dein Ziel erreichen.
  - Das Team hat sein Ziel früher als geplant erreicht.
  beispiele_en:
  - With regular training, you can reach your goal.
  - The team reached its goal earlier than planned.
  gebrauch: Ein Ziel setzen, verfolgen und erreichen.
eine Frage stellen:
  ausdruck: eine Frage stellen
  niveau: A2
  bedeutung: Jemanden um eine Auskunft bitten.
  beispiele:
  - Darf ich eine Frage stellen?
  - Der Schüler stellte eine interessante Frage.
  beispiele_en:
  - May I ask a question?
  - The student asked an interesting question.
  gebrauch: Auf Deutsch stellt man eine Frage und gibt eine Antwort.
zur Einsicht kommen:
  ausdruck: zur Einsicht kommen
  niveau: B2
  bedeutung: Nach Überlegung erkennen, dass man seine Meinung ändern sollte.
  beispiele:
  - Nach dem Gespräch kam er zur Einsicht, dass er sich geirrt hatte.
  - Sie kam schließlich zur Einsicht, dass der Plan zu riskant war.
  beispiele_en:
  - After the conversation, he realised he had been mistaken.
  - She eventually realised that the plan was too risky.
  gebrauch: 'Oft mit dass-Satz: zur Einsicht kommen, dass etwas nötig ist.'
eine Erfahrung machen:
  ausdruck: eine Erfahrung machen
  niveau: B1
  bedeutung: Etwas erleben und daraus etwas lernen.
  beispiele:
  - Im Praktikum habe ich viele neue Erfahrungen gemacht.
  - Mit diesem Gerät haben wir gute Erfahrungen gemacht.
  beispiele_en:
  - I gained a lot of new experience during the internship.
  - We've had good experiences with this device.
  gebrauch: Erfahrungen mit + Dativ machen; oft im Plural.
eine Antwort geben:
  ausdruck: eine Antwort geben
  niveau: A2
  bedeutung: Auf eine Frage reagieren und etwas dazu sagen.
  beispiele:
  - Kannst du mir heute eine Antwort geben?
  - Sie gab auf meine Frage keine klare Antwort.
  beispiele_en:
  - Can you give me an answer today?
  - She didn't give a clear answer to my question.
  gebrauch: Eine Antwort auf + Akkusativ geben.
im Vordergrund stehen:
  ausdruck: im Vordergrund stehen
  niveau: B2
  bedeutung: Die größte Aufmerksamkeit oder Bedeutung haben.
  beispiele:
  - Bei der Planung steht die Sicherheit im Vordergrund.
  - In ihrem Vortrag standen praktische Beispiele im Vordergrund.
  beispiele_en:
  - Safety is the main priority in the planning.
  - Practical examples were central to her talk.
  gebrauch: Im Vordergrund stehen heißt wichtig sein; in den Vordergrund stellen ist aktiv.
eine Debatte anstoßen:
  ausdruck: eine Debatte anstoßen
  niveau: C1
  bedeutung: Bewirken, dass Menschen beginnen, öffentlich über ein Thema zu diskutieren.
  beispiele:
  - Der Artikel stieß eine Debatte über Datenschutz an.
  - Mit ihrer Frage hat sie eine wichtige Debatte angestoßen.
  beispiele_en:
  - The article sparked a debate about data protection.
  - Her question sparked an important debate.
  gebrauch: 'Anstoßen ist trennbar: Er stößt eine Debatte an.'
einen Eindruck hinterlassen:
  ausdruck: einen Eindruck hinterlassen
  niveau: B1
  bedeutung: Bewirken, dass sich andere an etwas oder jemanden erinnern.
  beispiele:
  - Ihr Vortrag hat einen starken Eindruck hinterlassen.
  - Er wollte beim Gespräch einen guten Eindruck hinterlassen.
  beispiele_en:
  - Her talk made a strong impression.
  - He wanted to make a good impression at the interview.
  gebrauch: Einen guten, schlechten oder bleibenden Eindruck hinterlassen.
im Stau stehen:
  ausdruck: im Stau stehen
  niveau: A2
  bedeutung: Mit einem Fahrzeug wegen dichten Verkehrs nicht weiterkommen.
  beispiele:
  - Wir stehen seit einer halben Stunde im Stau.
  - Gestern stand ich auf dem Heimweg im Stau.
  beispiele_en:
  - We've been stuck in traffic for half an hour.
  - Yesterday I was stuck in traffic on the way home.
  gebrauch: Man steht im Stau, auch wenn man im Auto sitzt.
eine Entwicklung verfolgen:
  ausdruck: eine Entwicklung verfolgen
  niveau: B2
  bedeutung: Beobachten, wie sich etwas über längere Zeit verändert.
  beispiele:
  - Wir verfolgen die Entwicklung der Preise genau.
  - Die Ärztin verfolgt die Entwicklung über mehrere Wochen.
  beispiele_en:
  - We are closely monitoring price trends.
  - The doctor is monitoring the progress over several weeks.
  gebrauch: Verfolgen bedeutet hier beobachten, nicht hinterherlaufen.
eine Bewerbung schreiben:
  ausdruck: eine Bewerbung schreiben
  niveau: B1
  bedeutung: Eine schriftliche Bitte um eine Arbeitsstelle verfassen.
  beispiele:
  - Ich muss noch eine Bewerbung für die Stelle schreiben.
  - Sie schrieb am Wochenende mehrere Bewerbungen.
  beispiele_en:
  - I still need to write an application for the position.
  - She wrote several job applications over the weekend.
  gebrauch: Eine Bewerbung für eine Stelle schreiben; sich auf eine Stelle bewerben.
zu Hause bleiben:
  ausdruck: zu Hause bleiben
  niveau: A2
  bedeutung: Nicht weggehen oder nicht zur Arbeit beziehungsweise Schule fahren.
  beispiele:
  - Heute bleibe ich lieber zu Hause.
  - Wegen des Regens sind wir zu Hause geblieben.
  beispiele_en:
  - I'd rather stay at home today.
  - We stayed at home because of the rain.
  gebrauch: Zu Hause beschreibt den Ort; nach Hause beschreibt die Richtung.
Schlussfolgerungen ziehen:
  ausdruck: Schlussfolgerungen ziehen
  niveau: B2
  bedeutung: Aus Informationen oder Beobachtungen ein Ergebnis ableiten.
  beispiele:
  - Aus den Daten lassen sich klare Schlussfolgerungen ziehen.
  - Man sollte aus einem Einzelfall keine allgemeinen Schlussfolgerungen ziehen.
  beispiele_en:
  - Clear conclusions can be drawn from the data.
  - One should not draw general conclusions from a single case.
  gebrauch: Schlussfolgerungen aus + Dativ ziehen.
einen Antrag stellen:
  ausdruck: einen Antrag stellen
  niveau: B1
  bedeutung: Etwas offiziell und schriftlich beantragen.
  beispiele:
  - Für die Förderung müssen wir einen Antrag stellen.
  - Er stellte einen Antrag auf Verlängerung.
  beispiele_en:
  - We have to submit an application for the grant.
  - He applied for an extension.
  gebrauch: Einen Antrag auf + Akkusativ stellen.
Bescheid sagen:
  ausdruck: Bescheid sagen
  niveau: A2
  bedeutung: Jemandem eine Information mitteilen.
  beispiele:
  - Sag mir bitte Bescheid, wenn du angekommen bist.
  - Ich sage dir morgen Bescheid.
  beispiele_en:
  - Please let me know when you've arrived.
  - I'll let you know tomorrow.
  gebrauch: Jemandem Bescheid sagen; Bescheid wird großgeschrieben.
ein Risiko eingehen:
  ausdruck: ein Risiko eingehen
  niveau: B2
  bedeutung: Bewusst handeln, obwohl etwas schiefgehen könnte.
  beispiele:
  - Ohne gute Vorbereitung will ich kein Risiko eingehen.
  - Mit der Investition ging er ein großes Risiko ein.
  beispiele_en:
  - I don't want to take a risk without proper preparation.
  - He took a big risk with the investment.
  gebrauch: Ein Risiko eingehen; ein Risiko vermeiden oder begrenzen.
einen Vorschlag machen:
  ausdruck: einen Vorschlag machen
  niveau: B1
  bedeutung: Eine Idee nennen, über die andere entscheiden können.
  beispiele:
  - Darf ich einen Vorschlag machen?
  - Sie machte einen Vorschlag für das nächste Treffen.
  beispiele_en:
  - May I make a suggestion?
  - She made a suggestion for the next meeting.
  gebrauch: Jemandem einen Vorschlag machen; einen Vorschlag annehmen oder ablehnen.
sich Sorgen machen:
  ausdruck: sich Sorgen machen
  niveau: A2
  bedeutung: Über jemanden oder etwas beunruhigt sein.
  beispiele:
  - Meine Eltern machen sich Sorgen um mich.
  - Mach dir keine Sorgen, wir finden eine Lösung.
  beispiele_en:
  - My parents are worried about me.
  - Don't worry, we'll find a solution.
  gebrauch: 'Reflexiv mit um + Akkusativ: sich Sorgen um jemanden machen.'
einen Sachverhalt aufschlüsseln:
  ausdruck: einen Sachverhalt aufschlüsseln
  niveau: C1
  bedeutung: Eine komplexe Angelegenheit in verständliche Einzelteile zerlegen.
  beispiele:
  - Die Expertin schlüsselte den Sachverhalt Schritt für Schritt auf.
  - Können Sie den Sachverhalt für uns aufschlüsseln?
  beispiele_en:
  - The expert broke down the matter step by step.
  - Could you break down the situation for us?
  gebrauch: Aufschlüsseln ist trennbar und wird auch bei Kosten und Zahlen verwendet.
Verantwortung tragen:
  ausdruck: Verantwortung tragen
  niveau: B2
  bedeutung: Für eine Aufgabe oder für Folgen zuständig sein.
  beispiele:
  - Die Leitung trägt die Verantwortung für die Entscheidung.
  - Eltern tragen Verantwortung für ihre Kinder.
  beispiele_en:
  - Management bears responsibility for the decision.
  - Parents are responsible for their children.
  gebrauch: Verantwortung für + Akkusativ tragen; ähnlich wie Verantwortung übernehmen.
sich Mühe geben:
  ausdruck: sich Mühe geben
  niveau: B1
  bedeutung: Sich bei einer Aufgabe besonders anstrengen.
  beispiele:
  - Ich gebe mir Mühe, deutlich zu sprechen.
  - Er hat sich bei der Prüfung große Mühe gegeben.
  beispiele_en:
  - I'm trying hard to speak clearly.
  - He put a lot of effort into the exam.
  gebrauch: 'Reflexiv: sich Mühe geben, etwas zu tun.'
einen Kompromiss eingehen:
  ausdruck: einen Kompromiss eingehen
  niveau: B2
  bedeutung: Eine Lösung akzeptieren, bei der beide Seiten nachgeben.
  beispiele:
  - Beide Seiten mussten einen Kompromiss eingehen.
  - Bei der Arbeitszeit gingen wir einen Kompromiss ein.
  beispiele_en:
  - Both sides had to make a compromise.
  - We reached a compromise on working hours.
  gebrauch: Einen Kompromiss eingehen, schließen oder finden.
auf etwas verzichten:
  ausdruck: auf etwas verzichten
  niveau: B1
  bedeutung: Etwas bewusst nicht nutzen oder nicht nehmen.
  beispiele:
  - Ich möchte heute auf den Nachtisch verzichten.
  - Sie verzichtet im Alltag auf das Auto.
  beispiele_en:
  - I'd like to skip dessert today.
  - She avoids using the car in everyday life.
  gebrauch: 'Auf + Akkusativ verzichten: auf Zucker, auf Hilfe.'
eine Zusage erhalten:
  ausdruck: eine Zusage erhalten
  niveau: B2
  bedeutung: Eine verbindliche positive Antwort bekommen.
  beispiele:
  - Für die Stelle habe ich gestern eine Zusage erhalten.
  - Wir warten noch darauf, eine schriftliche Zusage zu erhalten.
  beispiele_en:
  - I received a job offer yesterday.
  - We're still waiting to receive written confirmation.
  gebrauch: Eine Zusage für eine Stelle oder eine schriftliche Zusage erhalten.
in Kontakt bleiben:
  ausdruck: in Kontakt bleiben
  niveau: B1
  bedeutung: Weiterhin miteinander sprechen oder schreiben.
  beispiele:
  - Nach dem Kurs wollen wir in Kontakt bleiben.
  - Bleiben wir in Kontakt, auch wenn du umziehst.
  beispiele_en:
  - We want to keep in touch after the course.
  - Let's keep in touch even when you move.
  gebrauch: Mit jemandem in Kontakt bleiben; Kontakt aufnehmen ist der Anfang.
etwas auf den Weg bringen:
  ausdruck: etwas auf den Weg bringen
  niveau: B2
  bedeutung: Ein Vorhaben offiziell beginnen und seine Umsetzung vorbereiten.
  beispiele:
  - Die Stadt will ein neues Wohnprojekt auf den Weg bringen.
  - Das Team brachte die Reform gemeinsam auf den Weg.
  beispiele_en:
  - The city wants to launch a new housing project.
  - The team launched the reform together.
  gebrauch: Auf den Weg bringen betont den Anfang eines längeren Prozesses.
den Überblick behalten:
  ausdruck: den Überblick behalten
  niveau: B1
  bedeutung: Auch bei vielen Informationen noch wissen, was wichtig ist.
  beispiele:
  - Mit einer Liste behalte ich den Überblick.
  - Bei so vielen Aufgaben ist es schwer, den Überblick zu behalten.
  beispiele_en:
  - A list helps me keep track of things.
  - With so many tasks, it's hard to keep track.
  gebrauch: Den Überblick über + Akkusativ behalten.
eine Grenze ziehen:
  ausdruck: eine Grenze ziehen
  niveau: B2
  bedeutung: Festlegen, was man nicht mehr akzeptiert.
  beispiele:
  - Bei persönlichen Fragen muss man manchmal eine Grenze ziehen.
  - Die Firma zog eine klare Grenze zwischen Arbeit und Freizeit.
  beispiele_en:
  - Sometimes you have to draw a line when it comes to personal questions.
  - The company drew a clear line between work and leisure.
  gebrauch: 'Auch: klare Grenzen setzen; eine Grenze zwischen zwei Bereichen ziehen.'
etwas in Betracht ziehen:
  ausdruck: etwas in Betracht ziehen
  niveau: B1
  bedeutung: Eine Möglichkeit ernsthaft prüfen.
  beispiele:
  - Wir ziehen einen Umzug in Betracht.
  - Sie zog auch eine kürzere Arbeitszeit in Betracht.
  beispiele_en:
  - We're considering a move.
  - She also considered working fewer hours.
  gebrauch: 'In Betracht ziehen ist trennbar: Ich ziehe den Plan in Betracht.'
etwas auf den Punkt bringen:
  ausdruck: etwas auf den Punkt bringen
  niveau: B2
  bedeutung: Den Kern einer Aussage kurz und treffend formulieren.
  beispiele:
  - Kannst du deinen Vorschlag auf den Punkt bringen?
  - Sie brachte das Problem mit einem Satz auf den Punkt.
  beispiele_en:
  - Can you sum up your proposal concisely?
  - She summed up the problem in a single sentence.
  gebrauch: Auf den Punkt bringen heißt präzise zusammenfassen.
eine These untermauern:
  ausdruck: eine These untermauern
  niveau: C1
  bedeutung: Eine Behauptung durch Belege oder Argumente stützen.
  beispiele:
  - Die Studie untermauert ihre These mit neuen Daten.
  - Er konnte seine These nicht mit Beispielen untermauern.
  beispiele_en:
  - The study supports her thesis with new data.
  - He couldn't back up his argument with examples.
  gebrauch: Eine These mit Belegen, Daten oder Argumenten untermauern.
